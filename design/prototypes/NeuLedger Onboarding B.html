<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NeuLedger · B Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: "DM Sans", -apple-system, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  @keyframes bDot {
    0%, 100% { opacity: 0.3; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-3px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="onboarding-variations.jsx"></script>
<script type="text/babel" src="onboarding-b-prototype.jsx"></script>

<script type="text/babel">
const NEU_B_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": false,
  "dense": false,
  "bgIntensity": 1
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweaks] = useTweaks(NEU_B_DEFAULTS);
  const { dark, dense, bgIntensity } = tweaks;

  const tones = [
    { id: 'warm', title: 'B1 · Warm', subtitle: 'Orange/peach orbs · the warm glass direction.' },
  ];

  return (
    <React.Fragment>
      <DesignCanvas>
        {tones.map(t => (
          <DCSection key={t.id} id={t.id} title={t.title} subtitle={t.subtitle}>
            <DCArtboard id={`${t.id}-flow`} label="Click-through · 3 steps + done" width={402} height={874}>
              <BFlow dark={dark} dense={dense} tone={t.id} bgIntensity={bgIntensity}/>
            </DCArtboard>
          </DCSection>
        ))}
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Appearance">
          <TweakToggle label="Dark mode" value={dark} onChange={v => setTweaks({ dark: v })}/>
          <TweakToggle label="Compact density" value={dense} onChange={v => setTweaks({ dense: v })}/>
          <TweakSlider label="Background intensity" value={bgIntensity} min={0} max={1.4} step={0.1} onChange={v => setTweaks({ bgIntensity: v })}/>
        </TweakSection>
        <TweakSection title="How to use">
          <div style={{ fontFamily: '"DM Sans", system-ui', fontSize: 12, color: 'rgba(60,50,40,0.7)', lineHeight: 1.5 }}>
            Each artboard is a live, clickable 3-step flow:
            <br/>· <b>Get Started</b> → Accounts → Ready → Done
            <br/>· Tap account cards to toggle
            <br/>· "Add custom account" opens a sheet
            <br/>· "Try extraction" runs an on-device AI demo
            <br/>· "↻ Restart flow" on the done screen
          </div>
        </TweakSection>
      </TweaksPanel>
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
