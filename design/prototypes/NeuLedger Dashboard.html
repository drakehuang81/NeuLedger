<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NeuLedger · Dashboard (B1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: "DM Sans", -apple-system, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  @keyframes bDot {
    0%, 100% { opacity: 0.3; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-3px); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="onboarding-variations.jsx"></script>
<script type="text/babel" src="onboarding-b-prototype.jsx"></script>
<script type="text/babel" src="dashboard-b1.jsx"></script>
<script type="text/babel" src="add-transaction.jsx"></script>

<script type="text/babel">
const NEU_DASH_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": true,
  "dense": false,
  "empty": false
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweaks] = useTweaks(NEU_DASH_DEFAULTS);
  const { dark, dense, empty } = tweaks;

  return (
    <React.Fragment>
      <DesignCanvas>
        <DCSection id="spacious" title="D1 · Spacious / Focused" subtitle="Hero balance, single insight at a time, large transaction rows. Calmer; better for first-time use.">
          <DCArtboard id="d1-home" label="Home · scrollable, tap rows to expand" width={402} height={874}>
            <DashSpacious dark={dark} dense={dense}/>
          </DCArtboard>
        </DCSection>
        <DCSection id="compact" title="D2 · Compact / Data-rich" subtitle="Stat strip + grouped transactions. New: 3 separated round-icon tab bar (per ref) and empty state.">
          <DCArtboard id="d2-home" label={empty ? 'Home · empty state' : 'Home · grouped, denser rows'} width={402} height={874}>
            <DashCompact dark={dark} dense={dense} empty={empty}/>
          </DCArtboard>
          <DCArtboard id="d2-empty" label="Home · empty state (always)" width={402} height={874}>
            <DashCompact dark={dark} dense={dense} empty={true}/>
          </DCArtboard>
        </DCSection>
        <DCSection id="add" title="Add Transaction · Full Page" subtitle="Live: type segmented control, AI quick fill (try 《星巴克 145 悠遊卡》), iOS num pad with +/− calc, category/account/date sheets, save → success animation.">
          <DCArtboard id="add-blank" label="Blank · type 《員工餐 80 現金》 in AI strip → 抽取" width={402} height={874}>
            <AddTransactionFull dark={dark}/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Appearance">
          <TweakToggle label="Dark mode" value={dark} onChange={v => setTweaks({ dark: v })}/>
          <TweakToggle label="Compact density" value={dense} onChange={v => setTweaks({ dense: v })}/>
          <TweakToggle label="Empty state (D2)" value={empty} onChange={v => setTweaks({ empty: v })}/>
        </TweakSection>
        <TweakSection title="Try the prototype">
          <div style={{ fontFamily: '"DM Sans", system-ui', fontSize: 12, color: 'rgba(60,50,40,0.7)', lineHeight: 1.5 }}>
            Both artboards are live:
            <br/>· Scroll the phone screen vertically
            <br/>· Tap account chips to switch view
            <br/>· Tap an insight dot or "Next →" to swipe
            <br/>· Tap a transaction row to expand
            <br/>· Tap <b>+</b> in the tab bar → <b>Full Add Transaction page</b> slides up
            <br/>· In Add: AI quick fill, num pad with +/−, sheets for cat/account/date
            <br/>· Save → success animation → returns to dashboard
          </div>
        </TweakSection>
      </TweaksPanel>
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
