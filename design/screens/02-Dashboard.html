const ICON_OPTIONS = [
  { id: 'wallet', label: 'Bank' },
  { id: 'banknote', label: 'Cash' },
  { id: 'creditcard', label: 'Credit' },
  { id: 'phone', label: 'E-wallet' },
];

const COLOR_OPTIONS = ['#FF9500','#0A84FF','#5E5CE6','#FF2D55','#34C759','#8E8E93'];

function BAccountI({ dark, dense, tone, bgIntensity = 1, accounts, setAccounts, onNext, onBack, onSkip }) {
  const fg = dark ? '#fff' : '#0A0A0A';
  const muted = dark ? 'rgba(235,235,245,0.65)' : 'rgba(60,60,67,0.65)';
  const pal = getTonePalette(tone, dark);
  const accent = dark ? pal.accentDark : pal.accent;
  const visible = useEnter([tone, dark]);

  const bg = `radial-gradient(ellipse at 80% 100%, ${pal.stops[0]} 0%, ${pal.stops[1]} 50%, ${pal.stops[2]} 90%)`;

  const [sheetOpen, setSheetOpen] = useState(false);
  const [draft, setDraft] = useState({ name: '', icon: 'wallet', color: COLOR_OPTIONS[0], amount: '' });

  const selectedCount = accounts.filter(a => a.selected).length;

  const toggle = (id) => {
    setAccounts(accounts.map(a => a.id === id ? { ...a, selected: !a.selected } : a));
  };

  const addCustom = () => {
    if (!draft.name.trim()) return;
    setAccounts([
      ...accounts,
      {
        id: 'custom-' + Date.now(),
        name: draft.name,
        type: ICON_OPTIONS.find(i => i.id === draft.icon).label,
        icon: draft.icon,
        color: draft.color,
        amount: parseInt(draft.amount.replace(/[^0-9]/g, '')) || 0,
        selected: true,
        custom: true,
      },
    ]);
    setSheetOpen(false);
    setDraft({ name: '', icon: 'wallet', color: COLOR_OPTIONS[0], amount: '' });
  };

  return (
    <Phone dark={dark} bg={bg}>
      <div style={{ position: 'absolute', inset: 0, zIndex: 0, overflow: 'hidden', pointerEvents: 'none' }}>
        <div style={{
          position: 'absolute', bottom: -60, right: -60, width: 260, height: 260, borderRadius: '50%',
          background: pal.orb1, opacity: 0.18 * bgIntensity, filter: 'blur(70px)',
        }}/>
      </div>

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', padding: dense ? '12px 22px 20px' : '20px 22px 28px', position: 'relative', zIndex: 1 }}>
        <Reveal visible={visible} delay={60} dir="up" distance={12}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
            <Tappable onClick={onBack}>
              <div style={{
                width: 34, height: 34, borderRadius: 17,
                background: dark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.04)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}>
                <svg width="9" height="14" viewBox="0 0 9 14" fill="none">
                  <path d="M7.5 1L1.5 7l6 6" stroke={fg} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </div>
            </Tappable>
            <div style={{ fontFamily: FONTS.body, fontSize: 13, color: muted, letterSpacing: -0.1 }}>Step 02 of 03</div>
          </div>
          <div style={{ fontFamily: FONTS.display, fontSize: 32, lineHeight: 1.05, fontWeight: 700, color: fg, letterSpacing: -1.2, marginBottom: 6 }}>Pick your<br/>accounts.</div>
          <div style={{ fontFamily: FONTS.body, fontSize: 14, color: muted, letterSpacing: -0.1, marginBottom: dense ? 14 : 20 }}>Tap to add. Long-press to edit.</div>
        </Reveal>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, flex: 1, alignContent: 'flex-start' }}>
          {accounts.map((a, i) => (
            <Reveal key={a.id} visible={visible} delay={140 + i * 60} dir="up" distance={14}>
              <Tappable onClick={() => toggle(a.id)}>
                <Glass dark={dark} radius={22} style={{
                  padding: dense ? '14px 14px' : '16px 16px',
                  minHeight: dense ? 124 : 140,
                  outline: a.selected ? `2px solid ${accent}` : 'none',
                  outlineOffset: -2,
                  transition: `outline .2s ${EASE}`,
                }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                    <div style={{
                      width: 36, height: 36, borderRadius: 11, background: a.color + '22',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                    }}>
                      <Glyph name={a.icon} size={20} color={a.color}/>
                    </div>
                    <div style={{
                      width: 22, height: 22, borderRadius: 11,
                      background: a.selected ? accent : 'transparent',
                      border: a.selected ? 'none' : `1.5px solid ${muted}`,
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      transition: `background .2s ${EASE}`,
                    }}>
                      {a.selected && <Glyph name="check" size={14} color="#fff" stroke={2.5}/>}
                    </div>
                  </div>
                  <div style={{ marginTop: dense ? 16 : 22 }}>
                    <div style={{ fontFamily: FONTS.mono, fontSize: 10, color: muted, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 4 }}>{a.type}</div>
                    <div style={{ fontFamily: FONTS.body, fontSize: 15, fontWeight: 600, color: fg, letterSpacing: -0.2, marginBottom: 4 }}>{a.name}</div>
                    <div style={{ fontFamily: FONTS.mono, fontSize: 13, color: a.amount ? fg : muted, letterSpacing: -0.2 }}>
                      {a.amount != null ? <><span style={{ fontSize: 10, color: muted, marginRight: 2 }}>NT$</span>{a.amount.toLocaleString()}</> : '— add balance'}
                    </div>
                  </div>
                </Glass>
              </Tappable>
            </Reveal>
          ))}
          <Reveal visible={visible} delay={140 + accounts.length * 60} dir="up" distance={14} style={{ gridColumn: '1 / -1' }}>
            <Tappable onClick={() => setSheetOpen(true)}>
              <Glass dark={dark} radius={22} style={{
                padding: '14px 14px', display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: 60,
              }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, color: muted }}>
                  <Glyph name="plus" size={18} color={muted}/>
                  <span style={{ fontFamily: FONTS.body, fontSize: 14, fontWeight: 500 }}>Add custom account</span>
                </div>
              </Glass>
            </Tappable>
          </Reveal>
        </div>

        <Reveal visible={visible} delay={420} dir="up" distance={10}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginTop: 16 }}>
            <PressButton accent={accent} onClick={onNext} disabled={selectedCount === 0}>
              Continue · {selectedCount} selected
            </PressButton>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <Dots count={3} active={1} dark={dark}/>
              <Tappable onClick={onSkip}><div style={{ fontFamily: FONTS.body, fontSize: 15, color: muted, padding: '6px 8px' }}>Skip</div></Tappable>
            </div>
          </div>
        </Reveal>
      </div>

      {/* Bottom sheet */}
      <Sheet open={sheetOpen} onClose={() => setSheetOpen(false)} dark={dark}>
        <div style={{ padding: '8px 22px 28px' }}>
          <div style={{ width: 38, height: 5, borderRadius: 3, background: dark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.15)', margin: '8px auto 18px' }}/>
          <div style={{ fontFamily: FONTS.display, fontSize: 24, fontWeight: 700, color: fg, letterSpacing: -0.7, marginBottom: 4 }}>新增帳戶</div>
          <div style={{ fontFamily: FONTS.body, fontSize: 13, color: muted, marginBottom: 18 }}>Name it, pick an icon and color.</div>

          <div style={{ marginBottom: 14 }}>
            <div style={{ fontFamily: FONTS.mono, fontSize: 10, color: muted, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 6 }}>Account name</div>
            <Glass dark={dark} radius={14} style={{ padding: '10px 14px' }}>
              <input
                value={draft.name}
                onChange={e => setDraft({ ...draft, name: e.target.value })}
                placeholder="e.g. 中信銀行"
                style={{
                  border: 'none', outline: 'none', background: 'transparent', width: '100%',
                  fontFamily: FONTS.body, fontSize: 16, color: fg, letterSpacing: -0.2,
                }}/>
            </Glass>
          </div>

          <div style={{ marginBottom: 14 }}>
            <div style={{ fontFamily: FONTS.mono, fontSize: 10, color: muted, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 6 }}>Type</div>
            <div style={{ display: 'flex', gap: 8 }}>
              {ICON_OPTIONS.map(opt => (
                <Tappable key={opt.id} onClick={() => setDraft({ ...draft, icon: opt.id })}>
                  <Glass dark={dark} radius={14} style={{
                    padding: '10px 12px', minWidth: 70,
                    outline: draft.icon === opt.id ? `2px solid ${accent}` : 'none', outlineOffset: -2,
                  }}>
                    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
                      <Glyph name={opt.id} size={20} color={draft.icon === opt.id ? accent : fg}/>
                      <div style={{ fontFamily: FONTS.body, fontSize: 11, color: muted }}>{opt.label}</div>
                    </div>
                  </Glass>
                </Tappable>
              ))}
            </div>
          </div>

          <div style={{ marginBottom: 14 }}>
            <div style={{ fontFamily: FONTS.mono, fontSize: 10, color: muted, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 6 }}>Color</div>
            <div style={{ display: 'flex', gap: 10 }}>
              {COLOR_OPTIONS.map(c => (
                <Tappable key={c} onClick={() => setDraft({ ...draft, color: c })}>
                  <div style={{
                    width: 30, height: 30, borderRadius: 15, background: c,
                    border: draft.color === c ? `2px solid ${dark ? '#fff' : '#000'}` : '2px solid transparent',
                    boxShadow: draft.color === c ? `0 0 0 2px ${c}` : 'none',
                  }}/>
                </Tappable>
              ))}
            </div>
          </div>

          <div style={{ marginBottom: 18 }}>
            <div style={{ fontFamily: FONTS.mono, fontSize: 10, color: muted, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 6 }}>Starting balance · NT$</div>
            <Glass dark={dark} radius={14} style={{ padding: '10px 14px' }}>
              <input
                value={draft.amount}
                onChange={e => setDraft({ ...draft, amount: e.target.value })}
                placeholder="0"
                inputMode="numeric"
                style={{
                  border: 'none', outline: 'none', background: 'transparent', width: '100%',
                  fontFamily: FONTS.mono, fontSize: 16, color: fg, letterSpacing: -0.2,
                }}/>
            </Glass>
          </div>

          <PressButton accent={accent} onClick={addCustom} disabled={!draft.name.trim()}>Add account</PressButton>
        </div>
      </Sheet>
    </Phone>
  );
}

// ─────────────────────────────────────────────────────────────
// Step 3 — Ready (live try-it demo)
// ─────────────────────────────────────────────────────────────
const TRY_PROMPTS = [
  { input: '咖啡 65', amount: 65, cat: '飲食 · Coffee', acc: 'Cash', merchant: 'Coffee shop', tags: ['#morning'], type: 'expense' },
  { input: '7-11 三明治 45', amount: 45, cat: '飲食 · Convenience', acc: 'Cash', merchant: '7-11', tags: ['#breakfast'], type: 'expense' },
  { input: '計程車回家 280', amount: 280, cat: '交通 · Taxi', acc: '玉山銀行', merchant: 'Uber', tags: ['#night'], type: 'expense' },
  { input: '薪水 65000', amount: 65000, cat: 'Salary · 薪資', acc: '玉山銀行', merchant: 'Employer', tags: ['#monthly'], type: 'income' },
];

function BReadyI({ dark, dense, tone, bgIntensity = 1, onFinish }) {
  const fg = dark ? '#fff' : '#0A0A0A';
  const muted = dark ? 'rgba(235,235,245,0.65)' : 'rgba(60,60,67,0.65)';
  const pal = getTonePalette(tone, dark);
  const accent = dark ? pal.accentDark : pal.accent;
  const visible = useEnter([tone, dark]);

  const bg = `radial-gradient(ellipse at 50% 30%, ${pal.stops[0]} 0%, ${pal.stops[1]} 40%, ${pal.stops[2]} 90%)`;

  const [promptIdx, setPromptIdx] = useState(0);
  const [extracted, setExtracted] = useState(null);
  const [extracting, setExtracting] = useState(false);
  const [ringFill, setRingFill] = useState(0);

  const prompt = TRY_PROMPTS[promptIdx];

  const tryIt = () => {
    setExtracting(true);
    setExtracted(null);
    setTimeout(() => {
      setExtracting(false);
      setExtracted(prompt);
      setRingFill(f => Math.min(100, f + 18 + Math.random() * 12));
    }, 900);
  };

  const next = () => {
    setPromptIdx((promptIdx + 1) % TRY_PROMPTS.length);
    setExtracted(null);
  };

  // Ring
  const radius = 64;
  const C = 2 * Math.PI * radius;

  return (
    <Phone dark={dark} bg={bg}>
      <div style={{ position: 'absolute', inset: 0, zIndex: 0, overflow: 'hidden', pointerEvents: 'none' }}>
        <div style={{
          position: 'absolute', top: 60, left: '50%', transform: 'translateX(-50%)',
          width: 280, height: 280, borderRadius: '50%',
          background: pal.orb1, opacity: 0.22 * bgIntensity, filter: 'blur(80px)',
        }}/>
      </div>

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', padding: dense ? '12px 22px 20px' : '20px 22px 28px', position: 'relative', zIndex: 1 }}>

        <Reveal visible={visible} delay={60} dir="up" distance={10}>
          <div style={{ fontFamily: FONTS.body, fontSize: 13, color: muted, letterSpacing: -0.1, textAlign: 'center' }}>Step 03 of 03</div>
          <div style={{ fontFamily: FONTS.display, fontSize: 30, lineHeight: 1, fontWeight: 700, color: fg, letterSpacing: -1.1, textAlign: 'center', marginTop: 4 }}>
            Try your first one.
          </div>
        </Reveal>

        {/* Mini ring + balance */}
        <Reveal visible={visible} delay={180} dir="scale">
          <div style={{ display: 'flex', alignItems: 'center', gap: 16, padding: dense ? '14px 0' : '20px 0', justifyContent: 'center' }}>
            <div style={{ position: 'relative', width: 150, height: 150 }}>
              <svg width="150" height="150" viewBox="0 0 150 150">
                <circle cx="75" cy="75" r={radius} fill="none"
                  stroke={dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.05)'} strokeWidth="14"/>
                <circle cx="75" cy="75" r={radius} fill="none"
                  stroke={accent} strokeWidth="14"
                  strokeDasharray={`${(ringFill/100) * C} ${C}`}
                  strokeLinecap="round"
                  transform="rotate(-90 75 75)"
                  style={{ transition: `stroke-dasharray .6s ${EASE}` }}
                />
              </svg>
              <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
                <div style={{ fontFamily: FONTS.mono, fontSize: 9, color: muted, textTransform: 'uppercase', letterSpacing: 1.5 }}>Tracked</div>
                <div style={{ fontFamily: FONTS.mono, fontSize: 22, fontWeight: 500, color: fg, letterSpacing: -0.5, marginTop: 2 }}>
                  {Math.round(ringFill)}%
                </div>
                <div style={{ fontFamily: FONTS.body, fontSize: 10, color: muted, marginTop: 2 }}>{extracted ? 'Logged ✓' : 'Tap to try'}</div>
              </div>
            </div>
          </div>
        </Reveal>

        {/* Prompt selector */}
        <Reveal visible={visible} delay={300} dir="up" distance={10}>
          <div style={{ display: 'flex', gap: 6, marginBottom: 10, overflowX: 'auto' }}>
            {TRY_PROMPTS.map((p, i) => (
              <Tappable key={i} onClick={() => { setPromptIdx(i); setExtracted(null); }}>
                <div style={{
                  padding: '6px 12px', borderRadius: 999, whiteSpace: 'nowrap',
                  background: i === promptIdx
                    ? accent
                    : (dark ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.6)'),
                  fontFamily: FONTS.body, fontSize: 12, fontWeight: 500,
                  color: i === promptIdx ? '#fff' : fg,
                  letterSpacing: -0.1,
                  border: i !== promptIdx ? (dark ? '0.5px solid rgba(255,255,255,0.1)' : '0.5px solid rgba(0,0,0,0.06)') : 'none',
                }}>{p.input}</div>
              </Tappable>
            ))}
          </div>
        </Reveal>

        {/* Try-it card */}
        <Reveal visible={visible} delay={380} dir="up" distance={10}>
          <Tappable onClick={tryIt}>
            <Glass dark={dark} radius={20} style={{ padding: '14px 16px', minHeight: 64 }}>
              {extracting ? (
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <Glyph name="sparkles" size={16} color={accent}/>
                  <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: muted, textTransform: 'uppercase', letterSpacing: 1.2, fontWeight: 500 }}>
                    Extracting on-device…
                  </div>
                  <div style={{ display: 'flex', gap: 4, marginLeft: 'auto' }}>
                    {[0,1,2].map(i => (
                      <div key={i} style={{
                        width: 6, height: 6, borderRadius: 3, background: accent,
                        opacity: 0.4,
                        animation: `bDot 1s ${i * 0.15}s infinite`,
                      }}/>
                    ))}
                  </div>
                </div>
              ) : extracted ? (
                <div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 10 }}>
                    <Glyph name="sparkles" size={12} color={accent}/>
                    <div style={{ fontFamily: FONTS.mono, fontSize: 10, color: muted, textTransform: 'uppercase', letterSpacing: 1.2, fontWeight: 500 }}>
                      Extracted · 0.{Math.floor(3 + Math.random() * 5)}s
                    </div>
                    <div style={{ marginLeft: 'auto', fontFamily: FONTS.mono, fontSize: 11, color: COLORS.income, display: 'flex', alignItems: 'center', gap: 4 }}>
                      <Glyph name="check" size={11} color={COLORS.income} stroke={2.5}/> Logged
                    </div>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 10 }}>
                    {[
                      { k: 'Amount', v: 'NT$ ' + extracted.amount.toLocaleString(), mono: true, c: extracted.type === 'income' ? COLORS.income : COLORS.expense },
                      { k: 'Category', v: extracted.cat },
                      { k: 'Account', v: extracted.acc },
                      { k: 'Merchant', v: extracted.merchant },
                    ].map((f, i) => (
                      <div key={i}>
                        <div style={{ fontFamily: FONTS.mono, fontSize: 9, color: muted, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 3 }}>{f.k}</div>
                        <div style={{ fontFamily: f.mono ? FONTS.mono : FONTS.body, fontSize: 13, fontWeight: 500, color: f.c || fg, letterSpacing: -0.1 }}>{f.v}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                    {extracted.tags.map((t, i) => (
                      <div key={i} style={{
                        padding: '3px 9px', borderRadius: 999,
                        background: dark ? `${accent}30` : `${accent}1f`,
                        fontFamily: FONTS.mono, fontSize: 10, color: accent, fontWeight: 500,
                      }}>{t}</div>
                    ))}
                  </div>
                </div>
              ) : (
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <div style={{
                    width: 32, height: 32, borderRadius: 16, background: accent,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    boxShadow: `0 4px 12px ${accent}50`,
                  }}>
                    <Glyph name="sparkles" size={16} color="#fff"/>
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontFamily: FONTS.body, fontSize: 14, fontWeight: 600, color: fg, letterSpacing: -0.1 }}>Tap to extract</div>
                    <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: muted, marginTop: 2 }}>"{prompt.input}" → on-device</div>
                  </div>
                  <Glyph name="arrow-right" size={16} color={muted} stroke={2}/>
                </div>
              )}
            </Glass>
          </Tappable>
        </Reveal>

        <div style={{ flex: 1 }}/>

        {/* Helper line */}
        <Reveal visible={visible} delay={500} dir="up" distance={8}>
          <div style={{ fontFamily: FONTS.body, fontSize: 12, color: muted, textAlign: 'center', marginBottom: 14, letterSpacing: -0.1 }}>
            {extracted
              ? 'Nice. Try another, or open NeuLedger.'
              : 'Pick a phrase above, then tap the card.'}
          </div>
        </Reveal>

        <Reveal visible={visible} delay={580} dir="up" distance={8}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {extracted ? (
              <PressButton accent={accent} onClick={onFinish}>Open NeuLedger</PressButton>
            ) : (
              <PressButton accent={accent} onClick={tryIt}>
                <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <Glyph name="sparkles" size={16} color="#fff"/>
                  Try extraction
                </span>
              </PressButton>
            )}
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <Tappable onClick={next}>
                <div style={{ fontFamily: FONTS.body, fontSize: 13, color: muted, padding: '6px 8px' }}>Next phrase →</div>
              </Tappable>
              <Dots count={3} active={2} dark={dark}/>
              <Tappable onClick={onFinish}>
                <div style={{ fontFamily: FONTS.body, fontSize: 13, color: muted, padding: '6px 8px' }}>Skip</div>
              </Tappable>
            </div>
          </div>
        </Reveal>
      </div>
    </Phone>
  );
}

// ─────────────────────────────────────────────────────────────
// Done screen — celebratory
// ─────────────────────────────────────────────────────────────
function BDone({ dark, tone, onRestart }) {
  const fg = dark ? '#fff' : '#0A0A0A';
  const muted = dark ? 'rgba(235,235,245,0.65)' : 'rgba(60,60,67,0.65)';
  const pal = getTonePalette(tone, dark);
  const accent = dark ? pal.accentDark : pal.accent;
  const visible = useEnter([tone, dark]);

  const bg = `radial-gradient(ellipse at 50% 50%, ${pal.stops[0]} 0%, ${pal.stops[1]} 40%, ${pal.stops[2]} 90%)`;

  return (
    <Phone dark={dark} bg={bg}>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', padding: '24px', alignItems: 'center', justifyContent: 'center', position: 'relative', zIndex: 1 }}>
        <Reveal visible={visible} delay={50} dir="scale">
          <div style={{
            width: 88, height: 88, borderRadius: 44,
            background: accent,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: `0 12px 40px ${accent}60`,
            marginBottom: 20,
          }}>
            <Glyph name="check" size={42} color="#fff" stroke={3}/>
          </div>
        </Reveal>
        <Reveal visible={visible} delay={200} dir="up" distance={14}>
          <div style={{ fontFamily: FONTS.display, fontSize: 36, fontWeight: 700, color: fg, letterSpacing: -1.2, textAlign: 'center', marginBottom: 8 }}>
            Welcome aboard.
          </div>
          <div style={{ fontFamily: FONTS.body, fontSize: 15, color: muted, textAlign: 'center', maxWidth: 280 }}>
            Onboarding complete · launching dashboard…
          </div>
        </Reveal>
        <Reveal visible={visible} delay={400} dir="up" distance={10}>
          <Tappable onClick={onRestart}>
            <div style={{ marginTop: 32, padding: '8px 16px', fontFamily: FONTS.body, fontSize: 13, color: muted }}>↻ Restart flow</div>
          </Tappable>
        </Reveal>
      </div>
    </Phone>
  );
}

// ─────────────────────────────────────────────────────────────
// Helpers — interaction
// ─────────────────────────────────────────────────────────────
function Tappable({ children, onClick, style }) {
  const [pressed, setPressed] = useState(false);
  return (
    <div
      onMouseDown={() => setPressed(true)}
      onMouseUp={() => setPressed(false)}
      onMouseLeave={() => setPressed(false)}
      onClick={onClick}
      style={{
        cursor: 'pointer', userSelect: 'none',
        transform: pressed ? 'scale(0.97)' : 'scale(1)',
        transition: `transform .12s ${EASE}`,
        ...style,
      }}
    >{children}</div>
  );
}

function PressButton({ children, accent, onClick, disabled }) {
  const [pressed, setPressed] = useState(false);
  return (
    <div
      onMouseDown={() => !disabled && setPressed(true)}
      onMouseUp={() => setPressed(false)}
      onMouseLeave={() => setPressed(false)}
      onClick={() => !disabled && onClick && onClick()}
      style={{
        height: 52, borderRadius: 26,
        background: disabled ? '#a8a8aa' : accent,
        opacity: disabled ? 0.5 : 1,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: FONTS.body, fontSize: 17, fontWeight: 600,
        color: '#fff', letterSpacing: -0.2, cursor: disabled ? 'default' : 'pointer',
        boxShadow: disabled ? 'none' : `0 8px 24px ${accent}40`,
        transform: pressed ? 'scale(0.98)' : 'scale(1)',
        transition: `transform .12s ${EASE}, box-shadow .15s ${EASE}`,
      }}
    >{children}</div>
  );
}

function Sheet({ open, onClose, dark, children }) {
  return (
    <React.Fragment>
      <div onClick={onClose} style={{
        position: 'absolute', inset: 0, zIndex: 100,
        background: open ? 'rgba(0,0,0,0.4)' : 'transparent',
        opacity: open ? 1 : 0,
        pointerEvents: open ? 'auto' : 'none',
        transition: `opacity .25s ${EASE}`,
      }}/>
      <div style={{
        position: 'absolute', left: 0, right: 0, bottom: 0, zIndex: 101,
        borderTopLeftRadius: 28, borderTopRightRadius: 28,
        background: dark ? '#1C1C1E' : '#FFFFFF',
        transform: open ? 'translateY(0)' : 'translateY(110%)',
        transition: `transform .35s ${EASE}`,
        maxHeight: '85%', overflow: 'auto',
        boxShadow: '0 -8px 40px rgba(0,0,0,0.2)',
      }}>{children}</div>
    </React.Fragment>
  );
}

// ─────────────────────────────────────────────────────────────
// Main controller — owns flow state for one tone
// ─────────────────────────────────────────────────────────────
function BFlow({ dark, dense, tone, bgIntensity }) {
  const [step, setStep] = useState(0);
  const [accounts, setAccounts] = useState(
    PRESET_ACCOUNTS.map((a, i) => ({ ...a, selected: i < 3 }))
  );

  const reset = () => {
    setStep(0);
    setAccounts(PRESET_ACCOUNTS.map((a, i) => ({ ...a, selected: i < 3 })));
  };

  const props = { dark, dense, tone, bgIntensity };

  if (step === 0) return <BWelcomeI {...props} onNext={() => setStep(1)} onSkip={() => setStep(3)}/>;
  if (step === 1) return <BAccountI {...props} accounts={accounts} setAccounts={setAccounts} onBack={() => setStep(0)} onNext={() => setStep(2)} onSkip={() => setStep(2)}/>;
  if (step === 2) return <BReadyI {...props} onFinish={() => setStep(3)}/>;
  return <BDone dark={dark} tone={tone} onRestart={reset}/>;
}

Object.assign(window, {
  BFlow, BWelcomeI, BAccountI, BReadyI, BDone,
  PRESET_ACCOUNTS, TONES, getTonePalette,
  EASE, Reveal, useEnter, Tappable, PressButton, Sheet,
  Tappable, PressButton, Sheet, Reveal, useEnter,
});

// ─────────────────────────────────────────────────────────────
// Quick add sheet
// ─────────────────────────────────────────────────────────────
function QuickAddSheet({ open, onClose, dark }) {
  const fg = dark ? '#fff' : '#0A0A0A';
  const muted = dark ? 'rgba(235,235,245,0.65)' : 'rgba(60,60,67,0.65)';
  const accent = dark ? COLORS.accentDark : COLORS.accent;
  const [text, setText] = useS('');
  const [extracting, setExtracting] = useS(false);
  const [result, setResult] = useS(null);

  const run = () => {
    if (!text.trim()) return;
    setExtracting(true); setResult(null);
    setTimeout(() => {
      setExtracting(false);
      const m = text.match(/\d+/);
      const amt = m ? parseInt(m[0]) : 100;
      setResult({
        amount: amt,
        cat: text.includes('咖啡') || text.includes('latte') ? '飲食 · Coffee' : (text.includes('車') || text.includes('Uber') ? '交通' : '購物'),
        account: '悠遊卡',
        merchant: text.split(/\s+/)[0] || 'Unknown',
      });
    }, 700);
  };

  useE(() => {
    if (!open) { setText(''); setResult(null); setExtracting(false); }
  }, [open]);

  return (
    <Sheet open={open} onClose={onClose} dark={dark}>
      <div style={{ padding: '8px 22px 28px' }}>
        <div style={{ width: 38, height: 5, borderRadius: 3, background: dark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.15)', margin: '8px auto 18px' }}/>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
          <Glyph name="sparkles" size={16} color={accent}/>
          <div style={{ fontFamily: FONTS.display, fontSize: 22, fontWeight: 700, color: fg, letterSpacing: -0.6 }}>Quick add</div>
        </div>
        <div style={{ fontFamily: FONTS.body, fontSize: 13, color: muted, marginBottom: 16, letterSpacing: -0.1 }}>
          Type or speak. AI fills the rest.
        </div>

        <Glass dark={dark} radius={20} style={{ padding: '14px 16px', marginBottom: 12 }}>
          <input
            value={text}
            onChange={e => setText(e.target.value)}
            placeholder="e.g. 星巴克 latte 165 元 用悠遊卡"
            style={{
              border: 'none', outline: 'none', background: 'transparent', width: '100%',
              fontFamily: FONTS.body, fontSize: 16, color: fg, letterSpacing: -0.2,
            }}/>
        </Glass>

        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 16 }}>
          {['咖啡 65', 'Uber 280', '7-11 早餐 45', '誠品 1250'].map((p, i) => (
            <Tappable key={i} onClick={() => setText(p)}>
              <div style={{
                padding: '6px 11px', borderRadius: 999,
                background: dark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.05)',
                fontFamily: FONTS.body, fontSize: 12, color: fg, fontWeight: 500,
              }}>{p}</div>
            </Tappable>
          ))}
        </div>

        {extracting && (
          <Glass dark={dark} radius={16} style={{ padding: '12px 14px', marginBottom: 14 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <Glyph name="sparkles" size={14} color={accent}/>
              <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: muted, textTransform: 'uppercase', letterSpacing: 1, fontWeight: 500 }}>Extracting…</div>
              <div style={{ display: 'flex', gap: 4, marginLeft: 'auto' }}>
                {[0,1,2].map(i => (
                  <div key={i} style={{
                    width: 6, height: 6, borderRadius: 3, background: accent,
                    opacity: 0.4, animation: `bDot 1s ${i * 0.15}s infinite`,
                  }}/>
                ))}
              </div>
            </div>
          </Glass>
        )}

        {result && (
          <Glass dark={dark} radius={20} style={{ padding: '14px 16px', marginBottom: 14 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 10 }}>
              <Glyph name="sparkles" size={12} color={accent}/>
              <div style={{ fontFamily: FONTS.mono, fontSize: 10, color: muted, textTransform: 'uppercase', letterSpacing: 1, fontWeight: 500 }}>Extracted</div>
              <div style={{ marginLeft: 'auto', fontFamily: FONTS.mono, fontSize: 11, color: muted }}>0.4s</div>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              {[
                { k: 'Amount', v: 'NT$ ' + result.amount.toLocaleString(), c: COLORS.expense },
                { k: 'Category', v: result.cat },
                { k: 'Account', v: result.account },
                { k: 'Merchant', v: result.merchant },
              ].map((f, i) => (
                <div key={i}>
                  <div style={{ fontFamily: FONTS.mono, fontSize: 9, color: muted, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 3 }}>{f.k}</div>
                  <div style={{ fontFamily: FONTS.body, fontSize: 14, fontWeight: 500, color: f.c || fg, letterSpacing: -0.1 }}>{f.v}</div>
                </div>
              ))}
            </div>
          </Glass>
        )}

        <PressButton accent={accent} onClick={result ? onClose : run} disabled={!text.trim() && !result}>
          {result ? 'Save transaction' : 'Extract with AI'}
        </PressButton>
      </div>
    </Sheet>
  );
}

// ─────────────────────────────────────────────────────────────
// iOS Numeric Keypad (matches IOSKeyboard glass style)
// ─────────────────────────────────────────────────────────────
function IOSNumPad({ dark, onPress, onDelete, onDone }) {
  const glyph = dark ? '#fff' : '#000';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';
  const keyBgDark = dark ? 'rgba(255,255,255,0.10)' : 'rgba(170,178,191,0.6)';

  const Key = ({ children, onClick, dim, fontSize = 26, fontWeight = 400 }) => (
    <Tappable onClick={onClick}>
      <div style={{
        height: 44, borderRadius: 9,
        background: dim ? keyBgDark : keyBg,
        boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: '-apple-system, "SF Pro", system-ui',
        fontSize, fontWeight, color: glyph,
        userSelect: 'none',
      }}>
        {children}
      </div>
    </Tappable>
  );

  const row = (cells) => (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 6.5 }}>
      {cells}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '14px 8px 4px',
      display: 'flex', flexDirection: 'column',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }}/>
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }}/>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 6.5, position: 'relative', padding: '0 4px' }}>
        {row([
          <Key key="1" onClick={() => onPress('1')}>1</Key>,
          <Key key="2" onClick={() => onPress('2')}>2</Key>,
          <Key key="3" onClick={() => onPress('3')}>3</Key>,
          <Key key="plus" onClick={() => onPress('+')} dim fontSize={22}>+</Key>,
        ])}
        {row([
          <Key key="4" onClick={() => onPress('4')}>4</Key>,
          <Key key="5" onClick={() => onPress('5')}>5</Key>,
          <Key key="6" onClick={() => onPress('6')}>6</Key>,
          <Key key="minus" onClick={() => onPress('-')} dim fontSize={22}>−</Key>,
        ])}
        {row([
          <Key key="7" onClick={() => onPress('7')}>7</Key>,
          <Key key="8" onClick={() => onPress('8')}>8</Key>,
          <Key key="9" onClick={() => onPress('9')}>9</Key>,
          <Key key="del" onClick={onDelete} dim fontSize={20}>
            <svg width="22" height="16" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>
          </Key>,
        ])}
        {row([
          <Key key="dot" onClick={() => onPress('.')}>.</Key>,
          <Key key="0" onClick={() => onPress('0')}>0</Key>,
          <Key key="000" onClick={() => onPress('000')} fontSize={20}>000</Key>,
          <Tappable key="done" onClick={onDone}>
            <div style={{
              height: 44, borderRadius: 9,
              background: COLORS.accent,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17, fontWeight: 600, color: '#fff',
              boxShadow: `0 2px 8px ${COLORS.accent}55`,
            }}>完成</div>
          </Tappable>,
        ])}
      </div>

      <div style={{ height: 28, position: 'relative' }}/>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// AI extraction strip
// ─────────────────────────────────────────────────────────────
function AIExtractStrip({ dark, status, onRun, value, setValue, onClear }) {
  const fg = dark ? '#fff' : '#0A0A0A';
  const muted = dark ? 'rgba(235,235,245,0.55)' : 'rgba(60,60,67,0.55)';
  const accent = dark ? COLORS.accentDark : COLORS.accent;

  return (
    <Glass dark={dark} radius={18} style={{ padding: '12px 14px' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}>
        <Glyph name="sparkles" size={13} color={accent}/>
        <div style={{
          fontFamily: FONTS.mono, fontSize: 10, color: muted,
          textTransform: 'uppercase', letterSpacing: 1.2, fontWeight: 500,
        }}>AI Quick fill · on-device</div>
        {status === 'extracting' && (
          <div style={{ display: 'flex', gap: 3, marginLeft: 'auto' }}>
            {[0,1,2].map(i => (
              <div key={i} style={{
                width: 5, height: 5, borderRadius: 3, background: accent,
                opacity: 0.4, animation: `bDot 1s ${i * 0.15}s infinite`,
              }}/>
            ))}
          </div>
        )}
        {status === 'filled' && (
          <div style={{
            marginLeft: 'auto',
            padding: '2px 8px', borderRadius: 999,
            background: 'rgba(52,199,89,0.15)',
            color: dark ? COLORS.incomeDark : COLORS.income,
            fontFamily: FONTS.mono, fontSize: 9, fontWeight: 600, letterSpacing: 0.5,
          }}>FILLED</div>
        )}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <input
          value={value}
          onChange={e => setValue(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') onRun(); }}
          placeholder="例:咖啡 65 悠遊卡"
          style={{
            border: 'none', outline: 'none', background: 'transparent', flex: 1, minWidth: 0,
            fontFamily: FONTS.body, fontSize: 14, color: fg, letterSpacing: -0.15,
          }}/>
        {value && status !== 'extracting' && (
          <Tappable onClick={onClear}>
            <div style={{
              width: 18, height: 18, borderRadius: 9,
              background: dark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.1)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              color: dark ? '#fff' : '#000', fontSize: 12, lineHeight: 1,
            }}>×</div>
          </Tappable>
        )}
        <Tappable onClick={onRun}>
          <div style={{
            padding: '6px 12px', borderRadius: 999,
            background: value.trim() ? accent : (dark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.06)'),
            color: value.trim() ? '#fff' : muted,
            fontFamily: FONTS.body, fontSize: 12, fontWeight: 600, letterSpacing: -0.1,
          }}>抽取</div>
        </Tappable>
      </div>
    </Glass>
  );
}

  // Build April 2026 mock calendar (matches "today: 25 Apr")
  const days = [];
  const firstDay = 3; // Wed = 3 (April 1, 2026)
  const lastDate = 30;
  for (let i = 0; i < firstDay; i++) days.push(null);
  for (let d = 1; d <= lastDate; d++) days.push(d);

  const today = 25;
  const sel = value ? value.day : today;

    <Sheet open={open} onClose={onClose} dark={dark}>
      <div style={{ padding: '8px 0 28px' }}>

                </svg>
              </div>
              <div style={{
                width: 28, height: 28, borderRadius: 14,
                background: dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.04)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}>
                <svg width="8" height="14" viewBox="0 0 8 14" fill="none">
                  <path d="M1 1l6 6-6 6" stroke={muted} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </div>
            </div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4 }}>
            {['S','M','T','W','T','F','S'].map((d, i) => (
              <div key={i} style={{
                fontFamily: FONTS.mono, fontSize: 10, textAlign: 'center', padding: '4px 0',
                color: muted, textTransform: 'uppercase', letterSpacing: 0.5,
              }}>{d}</div>
            ))}
            {days.map((d, i) => (
              <Tappable key={i} onClick={() => d && onPick({ day: d, label: `4/${d}` })}>
                <div style={{
                  height: 38, borderRadius: 10,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  background: d === sel ? accent : (d === today && d !== sel ? (dark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.05)') : 'transparent'),
                  color: d === sel ? '#fff' : (d ? fg : 'transparent'),
                  fontFamily: FONTS.mono, fontSize: 14,
                  fontWeight: d === sel || d === today ? 600 : 400,
                  letterSpacing: -0.2,
                  border: d === today && d !== sel ? `1px solid ${accent}` : 'none',
                }}>{d || ''}</div>
              </Tappable>
            ))}
          </div>
        </div>
      </div>
    </Sheet>
  );
}

// ─────────────────────────────────────────────────────────────
// Tag chip + add
// ─────────────────────────────────────────────────────────────
const TAG_SUGGESTIONS = ['#morning', '#commute', '#monthly', '#books', '#date', '#work'];

function TagsField({ tags, setTags, dark }) {
  const fg = dark ? '#fff' : '#0A0A0A';
  const muted = dark ? 'rgba(235,235,245,0.55)' : 'rgba(60,60,67,0.55)';
  const accent = dark ? COLORS.accentDark : COLORS.accent;
  const [picking, setPicking] = useS2(false);
  return (
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, alignItems: 'center', flex: 1 }}>
      {tags.length === 0 && !picking && (
        <Tappable onClick={() => setPicking(true)}>
          <div style={{
            fontFamily: FONTS.body, fontSize: 14, color: muted, letterSpacing: -0.15,
          }}>加標籤</div>
        </Tappable>
      )}
      {tags.map((t, i) => (
        <Tappable key={i} onClick={() => setTags(tags.filter(x => x !== t))}>
          <div style={{
            padding: '3px 9px', borderRadius: 999,
            background: dark ? 'rgba(255,159,10,0.18)' : 'rgba(255,149,0,0.12)',
            color: accent,
            fontFamily: FONTS.mono, fontSize: 11, fontWeight: 500, letterSpacing: -0.1,
            display: 'flex', alignItems: 'center', gap: 4,
          }}>
            {t}
            <span style={{ fontSize: 10, opacity: 0.7 }}>×</span>
          </div>
        </Tappable>
      ))}
      {picking && (
        <React.Fragment>
          {TAG_SUGGESTIONS.filter(t => !tags.includes(t)).slice(0, 4).map(t => (
            <Tappable key={t} onClick={() => { setTags([...tags, t]); setPicking(false); }}>
              <div style={{
                padding: '3px 9px', borderRadius: 999,
                background: dark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.05)',
                color: fg,
                fontFamily: FONTS.mono, fontSize: 11, fontWeight: 500, letterSpacing: -0.1,
                border: `1px dashed ${accent}66`,
              }}>{t}</div>
            </Tappable>
          ))}
        </React.Fragment>
      )}
      {tags.length > 0 && !picking && (
        <Tappable onClick={() => setPicking(true)}>
          <div style={{
            padding: '3px 8px', borderRadius: 999,
            border: `1px dashed ${dark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.15)'}`,
            color: muted,
            fontFamily: FONTS.mono, fontSize: 11, letterSpacing: -0.1,
          }}>+</div>
        </Tappable>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Success overlay (saving → saved)
// ─────────────────────────────────────────────────────────────
function SaveSuccess({ visible, dark, onDone, txn }) {
  const fg = dark ? '#fff' : '#0A0A0A';
  const muted = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const accent = dark ? COLORS.accentDark : COLORS.accent;

  useE2(() => {
    if (!visible) return;
    const t = setTimeout(onDone, 1400);
    return () => clearTimeout(t);
  }, [visible, onDone]);

  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 200,
      background: dark ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.85)',
      backdropFilter: 'blur(20px)',
      WebkitBackdropFilter: 'blur(20px)',
      opacity: visible ? 1 : 0,
      pointerEvents: visible ? 'auto' : 'none',
      transition: `opacity .25s ${EASE}`,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      flexDirection: 'column', padding: '0 30px',
    }}>
      <div style={{
        transform: visible ? 'scale(1)' : 'scale(0.7)',
        opacity: visible ? 1 : 0,
        transition: `all .4s ${EASE}`,
        marginBottom: 18,
      }}>
        <div style={{
          width: 80, height: 80, borderRadius: 40,
          background: `linear-gradient(135deg, ${accent}, #FF6A00)`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: `0 12px 40px ${accent}60`,
        }}>
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none">
            <path d="M5 12.5l5 5L19 8" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </div>
      </div>
      <div style={{
        fontFamily: FONTS.display, fontSize: 24, fontWeight: 700,
        color: fg, letterSpacing: -0.6, marginBottom: 6,
        opacity: visible ? 1 : 0,
        transition: `opacity .3s .15s ${EASE}`,
      }}>已記下</div>
      {txn && (
        <div style={{
          fontFamily: FONTS.mono, fontSize: 14, color: muted, letterSpacing: -0.1,
          opacity: visible ? 1 : 0,
          transition: `opacity .3s .25s ${EASE}`,
          textAlign: 'center',
        }}>
          {txn.type === 'income' ? '+' : '−'}NT$ {(txn.amount || 0).toLocaleString()} · {txn.cat?.label || '未分類'}
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Main: AddTransactionInner (full-page content, no Phone wrapper)
// ─────────────────────────────────────────────────────────────
function AddTransactionInner({ dark, onClose, onSave }) {
  const fg = dark ? '#fff' : '#0A0A0A';
  const muted = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const accent = dark ? COLORS.accentDark : COLORS.accent;

  const [type, setType] = useS2('expense');
  const [amount, setAmount] = useS2('');
  const [cat, setCat] = useS2(null);
  const [account, setAccount] = useS2(ACCOUNTS[0]);
  const [accountTo, setAccountTo] = useS2(ACCOUNTS[1]);
  const [date, setDate] = useS2({ day: 25, label: '今天 · 4/25' });
  const [merchant, setMerchant] = useS2('');
  const [note, setNote] = useS2('');
  const [tags, setTags] = useS2([]);

  const [aiText, setAiText] = useS2('');
  const [aiStatus, setAiStatus] = useS2('idle'); // idle | extracting | filled
  const [showNum, setShowNum] = useS2(true);
  const [sheet, setSheet] = useS2(null); // 'cat' | 'account' | 'accountTo' | 'date' | null
  const [saving, setSaving] = useS2(false);

  const visible = useEnter([dark]);

  const amountColor = type === 'expense' ? (dark ? COLORS.expenseDark : COLORS.expense)
                    : type === 'income' ? (dark ? COLORS.incomeDark : COLORS.income)
                    : '#5E5CE6';

  // Amount evaluation (supports +/-)
  const evalAmount = (s) => {
    if (!s) return 0;
    try {
      const cleaned = s.replace(/[^\d+\-.]/g, '');
      // eslint-disable-next-line no-new-func
      const v = Function(`"use strict"; return (${cleaned || '0'})`)();
      return isNaN(v) ? 0 : v;
    } catch { return 0; }
  };
  const amountValue = evalAmount(amount);

  const runAI = () => {
    if (!aiText.trim()) return;
    setAiStatus('extracting');
    setShowNum(false);
    setTimeout(() => {
      // Mock parse
      const m = aiText.match(/\d+/);
      const amt = m ? m[0] : '';
      const lower = aiText.toLowerCase();
      let pickedCat = CAT_GROUPS[0].items[3]; // coffee default
      let pickedColor = CAT_GROUPS[0].color;
      let pickedGroup = CAT_GROUPS[0].label;
      if (lower.includes('uber') || aiText.includes('車') || aiText.includes('計程')) {
        pickedCat = CAT_GROUPS[1].items[2];
        pickedColor = CAT_GROUPS[1].color;
        pickedGroup = CAT_GROUPS[1].label;
      } else if (aiText.includes('7-11') || aiText.includes('全家') || aiText.includes('便利')) {
        pickedCat = CAT_GROUPS[0].items[5];
        pickedColor = CAT_GROUPS[0].color;
        pickedGroup = CAT_GROUPS[0].label;
      } else if (aiText.includes('書')) {
        pickedCat = CAT_GROUPS[2].items[1];
        pickedColor = CAT_GROUPS[2].color;
        pickedGroup = CAT_GROUPS[2].label;
      } else if (aiText.includes('咖啡') || lower.includes('latte') || lower.includes('coffee') || lower.includes('starbucks') || aiText.includes('星巴克')) {
        pickedCat = CAT_GROUPS[0].items[3];
        pickedColor = CAT_GROUPS[0].color;
        pickedGroup = CAT_GROUPS[0].label;
      }
      let pickedAcc = ACCOUNTS[0];
      if (aiText.includes('悠遊')) pickedAcc = ACCOUNTS[2];
      else if (aiText.includes('玉山') || aiText.includes('銀行')) pickedAcc = ACCOUNTS[1];
      else if (aiText.includes('卡') || lower.includes('visa')) pickedAcc = ACCOUNTS[3];

      setAmount(amt);
      setCat({ ...pickedCat, color: pickedColor, group: pickedGroup });
      setAccount(pickedAcc);
      setMerchant(aiText.split(/\s+/)[0] || '');
      setAiStatus('filled');
    }, 750);
  };

  const clearAI = () => {
    setAiText(''); setAiStatus('idle');
  };

  const canSave = amountValue > 0 && (type === 'transfer' || cat);

  const save = () => {
    if (!canSave) return;
    setSaving(true);
  };

  const onSaveDone = () => {
    onSave && onSave({ type, amount: amountValue, cat, account, date, merchant, note, tags });
    setSaving(false);
    onClose();
  };

  // bg
  const bg = dark
    ? 'radial-gradient(ellipse at 50% -10%, #4A2A0E 0%, #1a0f08 30%, #050505 60%)'
    : 'radial-gradient(ellipse at 50% -10%, #FFE4B8 0%, #FFF6E8 30%, #FAFAF7 60%)';

  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: bg,
      display: 'flex', flexDirection: 'column',
      paddingTop: 54, // status bar height
    }}>
      {/* orb */}
      <div style={{ position: 'absolute', inset: 0, zIndex: 0, overflow: 'hidden', pointerEvents: 'none' }}>
        <div style={{
          position: 'absolute', top: -40, right: -60, width: 240, height: 240, borderRadius: '50%',
          background: amountColor, opacity: dark ? 0.20 : 0.22, filter: 'blur(80px)',
          transition: `background .3s ${EASE}`,
        }}/>
      </div>

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', position: 'relative', zIndex: 1, overflow: 'hidden' }}>
        {/* Top bar: cancel + title + save */}
        <Reveal visible={visible} delay={50} dir="down" distance={10}>
          <div style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '0 18px 8px',
          }}>
            <Tappable onClick={onClose}>
              <div style={{
                fontFamily: FONTS.body, fontSize: 15, color: muted, fontWeight: 500, letterSpacing: -0.15,
                padding: '8px 4px',
              }}>取消</div>
            </Tappable>
            <div style={{ fontFamily: FONTS.display, fontSize: 17, fontWeight: 600, color: fg, letterSpacing: -0.3 }}>
              新增交易
            </div>
            <Tappable onClick={save}>
              <div style={{
                fontFamily: FONTS.body, fontSize: 15, fontWeight: 600, letterSpacing: -0.15,
                padding: '8px 4px',
                color: canSave ? accent : muted,
                opacity: canSave ? 1 : 0.5,
              }}>儲存</div>
            </Tappable>
          </div>
        </Reveal>

        {/* Scrollable content */}
        <div style={{ flex: 1, overflow: 'auto', padding: '0 18px' }}>
          {/* Type segmented */}
          <Reveal visible={visible} delay={120} dir="up" distance={12}>
            <div style={{ marginBottom: 14 }}>
              <TypeSegmented value={type} onChange={(v) => { setType(v); setCat(null); }} dark={dark}/>
            </div>
          </Reveal>

          {/* Amount hero */}
          <Reveal visible={visible} delay={180} dir="up" distance={14}>
            <Tappable onClick={() => setShowNum(true)}>
              <Glass dark={dark} radius={22} style={{ padding: '18px 22px', marginBottom: 14 }}>
                <div style={{
                  fontFamily: FONTS.mono, fontSize: 10, color: muted,
                  textTransform: 'uppercase', letterSpacing: 1.2, marginBottom: 6,
                }}>金額</div>
                <div style={{
                  display: 'flex', alignItems: 'baseline', gap: 6,
                  fontFamily: FONTS.mono, fontWeight: 500,
                  color: amount ? amountColor : muted,
                  letterSpacing: -1.5, lineHeight: 1,
                }}>
                  <span style={{ fontSize: 18, fontWeight: 400 }}>NT$</span>
                  <span style={{ fontSize: 44 }}>
                    {type === 'expense' && amount ? '−' : type === 'income' && amount ? '+' : ''}
                    {amount ? amountValue.toLocaleString() : '0'}
                  </span>
                  {showNum && (
                    <span style={{
                      width: 2, height: 36, background: amountColor,
                      animation: 'bDot 1s infinite', marginLeft: 2,
                    }}/>
                  )}
                </div>
                {amount && amount.match(/[+\-]/) && (
                  <div style={{
                    fontFamily: FONTS.mono, fontSize: 11, color: muted,
                    marginTop: 6, letterSpacing: -0.1,
                  }}>= {amount}</div>
                )}
              </Glass>
            </Tappable>
          </Reveal>

          {/* AI extraction */}
          <Reveal visible={visible} delay={240} dir="up" distance={12}>
            <div style={{ marginBottom: 14 }}>
              <AIExtractStrip
                dark={dark}
                status={aiStatus}
                value={aiText}
                setValue={setAiText}
                onRun={runAI}
                onClear={clearAI}
              />
            </div>
          </Reveal>

          {/* Field group */}
          <Reveal visible={visible} delay={300} dir="up" distance={10}>
            <Glass dark={dark} radius={18} style={{ marginBottom: 14, overflow: 'hidden', padding: 0 }}>
              {type !== 'transfer' && (
                <FieldRow label="分類" dark={dark} onTap={() => { setShowNum(false); setSheet('cat'); }}>
                  {cat ? (
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div style={{
                        width: 26, height: 26, borderRadius: 13,
                        background: cat.color + '30',
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        fontSize: 14,
                      }}>{cat.emoji}</div>
                      <div style={{ fontFamily: FONTS.body, fontSize: 14, color: fg, fontWeight: 500, letterSpacing: -0.15 }}>
                        {cat.label}
                      </div>
                      {cat.group && (
                        <div style={{ fontFamily: FONTS.body, fontSize: 12, color: muted, letterSpacing: -0.1 }}>
                          · {cat.group}
                        </div>
                      )}
                    </div>
                  ) : (
                    <div style={{ fontFamily: FONTS.body, fontSize: 14, color: muted, letterSpacing: -0.15 }}>未選</div>
                  )}
                </FieldRow>
              )}
              <FieldRow label={type === 'transfer' ? '從' : '帳戶'} dark={dark} onTap={() => { setShowNum(false); setSheet('account'); }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <div style={{ width: 8, height: 8, borderRadius: 4, background: account.color }}/>
                  <div style={{ fontFamily: FONTS.body, fontSize: 14, color: fg, fontWeight: 500, letterSpacing: -0.15 }}>
                    {account.label}
                  </div>
                  <div style={{ fontFamily: FONTS.mono, fontSize: 11, color: muted, letterSpacing: -0.1 }}>
                    · {account.balance < 0 ? '−' : ''}{Math.abs(account.balance).toLocaleString()}
                  </div>
                </div>
              </FieldRow>
              {type === 'transfer' && (
                <FieldRow label="到" dark={dark} onTap={() => { setShowNum(false); setSheet('accountTo'); }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <div style={{ width: 8, height: 8, borderRadius: 4, background: accountTo.color }}/>
                    <div style={{ fontFamily: FONTS.body, fontSize: 14, color: fg, fontWeight: 500, letterSpacing: -0.15 }}>
                      {accountTo.label}
                    </div>
                  </div>
                </FieldRow>
              )}
              <FieldRow label="日期" dark={dark} onTap={() => { setShowNum(false); setSheet('date'); }}>
                <div style={{ fontFamily: FONTS.body, fontSize: 14, color: fg, fontWeight: 500, letterSpacing: -0.15 }}>
                  {date.label}
                </div>
              </FieldRow>
              <FieldRow label="商家" dark={dark}>
                <input
                  value={merchant}
                  onChange={e => setMerchant(e.target.value)}
                  onFocus={() => setShowNum(false)}
                  placeholder="(optional)"
                  style={{
                    border: 'none', outline: 'none', background: 'transparent', flex: 1,
                    fontFamily: FONTS.body, fontSize: 14, color: fg, letterSpacing: -0.15,
                  }}/>
              </FieldRow>
              <FieldRow label="備註" dark={dark}>
                <input
                  value={note}
                  onChange={e => setNote(e.target.value)}
                  onFocus={() => setShowNum(false)}
                  placeholder="(optional)"
                  style={{
                    border: 'none', outline: 'none', background: 'transparent', flex: 1,
                    fontFamily: FONTS.body, fontSize: 14, color: fg, letterSpacing: -0.15,
                  }}/>
              </FieldRow>
              <FieldRow label="標籤" dark={dark} isLast>
                <TagsField tags={tags} setTags={setTags} dark={dark}/>
              </FieldRow>
            </Glass>
          </Reveal>

          {/* Bottom spacer to clear the keypad */}
          <div style={{ height: showNum ? 320 : 80 }}/>
        </div>

        {/* Numeric keypad */}
        <div style={{
          position: 'absolute', left: 0, right: 0, bottom: 0, zIndex: 50,
          transform: showNum ? 'translateY(0)' : 'translateY(110%)',
          transition: `transform .3s ${EASE}`,
        }}>
          <IOSNumPad
            dark={dark}
            onPress={(c) => {
              setAmount(prev => {
                if (c === '.') {
                  if (prev.includes('.') && !/[+\-]/.test(prev.split('.').pop() || '')) return prev;
                }
                return (prev + c);
              });
            }}
            onDelete={() => setAmount(prev => prev.slice(0, -1))}
            onDone={() => setShowNum(false)}
          />
        </div>

        {/* Sheets */}
        <CategorySheet
          open={sheet === 'cat'}
          onClose={() => setSheet(null)}
          dark={dark}
          type={type}
          current={cat}
          onPick={(c) => { setCat(c); setSheet(null); }}
        />
        <AccountSheet
          open={sheet === 'account'}
          onClose={() => setSheet(null)}
          dark={dark}
          current={account}
          label={type === 'transfer' ? '從哪個帳戶' : '選擇帳戶'}
          onPick={(a) => { setAccount(a); setSheet(null); }}
        />
        <AccountSheet
          open={sheet === 'accountTo'}
          onClose={() => setSheet(null)}
          dark={dark}
          current={accountTo}
          label="到哪個帳戶"
          onPick={(a) => { setAccountTo(a); setSheet(null); }}
        />
        <DateSheet
          open={sheet === 'date'}
          onClose={() => setSheet(null)}
          dark={dark}
          value={date}
          onPick={(d) => { setDate(d); setSheet(null); }}
        />

        <SaveSuccess
          visible={saving}
          dark={dark}
          onDone={onSaveDone}
          txn={{ type, amount: amountValue, cat }}
        />
      </div>
    </div>
  );
}

// Standalone artboard wrapper: full Phone shell
function AddTransactionFull({ dark, onClose, onSave }) {
  const bg = dark
    ? 'radial-gradient(ellipse at 50% -10%, #4A2A0E 0%, #1a0f08 30%, #050505 60%)'
    : 'radial-gradient(ellipse at 50% -10%, #FFE4B8 0%, #FFF6E8 30%, #FAFAF7 60%)';
  return (
    <Phone dark={dark} bg={bg}>
      <AddTransactionInner
        dark={dark}
        onClose={onClose || (() => {})}
        onSave={onSave}
      />
    </Phone>
  );
}

// Overlay slide-up version (sits inside an existing Phone shell)
function AddTransactionOverlay({ open, dark, onClose, onSave }) {
  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 100,
      transform: open ? 'translateY(0)' : 'translateY(100%)',
      transition: `transform .35s ${EASE}`,
      pointerEvents: open ? 'auto' : 'none',
      borderRadius: open ? 0 : 32,
      overflow: 'hidden',
    }}>
      <AddTransactionInner dark={dark} onClose={onClose} onSave={onSave}/>
    </div>
  );
}

Object.assign(window, { AddTransactionFull, AddTransactionInner, AddTransactionOverlay });

</script>

<script type="text/babel">
const NEU_DASH_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": true,
  "dense": false,
  "empty": false
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweaks] = useTweaks(NEU_DASH_DEFAULTS);
  const { dark, dense, empty } = tweaks;

  return (
    <React.Fragment>
      <DesignCanvas>
        <DCSection id="spacious" title="D1 · Spacious / Focused" subtitle="Hero balance, single insight at a time, large transaction rows. Calmer; better for first-time use.">
          <DCArtboard id="d1-home" label="Home · scrollable, tap rows to expand" width={402} height={874}>
            <DashSpacious dark={dark} dense={dense}/>
          </DCArtboard>
        </DCSection>
        <DCSection id="compact" title="D2 · Compact / Data-rich" subtitle="Stat strip + grouped transactions. New: 3 separated round-icon tab bar (per ref) and empty state.">
          <DCArtboard id="d2-home" label={empty ? 'Home · empty state' : 'Home · grouped, denser rows'} width={402} height={874}>
            <DashCompact dark={dark} dense={dense} empty={empty}/>
          </DCArtboard>
          <DCArtboard id="d2-empty" label="Home · empty state (always)" width={402} height={874}>
            <DashCompact dark={dark} dense={dense} empty={true}/>
          </DCArtboard>
        </DCSection>
        <DCSection id="add" title="Add Transaction · Full Page" subtitle="Live: type segmented control, AI quick fill (try 《星巴克 145 悠遊卡》), iOS num pad with +/− calc, category/account/date sheets, save → success animation.">

      <TweaksPanel title="Tweaks">

          <TweakToggle label="Dark mode" value={dark} onChange={v => setTweaks({ dark: v })}/>

          <TweakToggle label="Empty state (D2)" value={empty} onChange={v => setTweaks({ empty: v })}/>
