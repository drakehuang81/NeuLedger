<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>NeuLedger · First-Run Flow Demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body { margin: 0; padding: 0; background: #1A1714; min-height: 100vh; font-family: "DM Sans", -apple-system, system-ui, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  body { padding: 36px 24px 60px; display: flex; flex-direction: column; align-items: center; gap: 28px; }

  .demo-header { text-align: center; max-width: 720px; }
  .demo-eyebrow { font-family: "DM Mono", monospace; font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: rgba(255,255,255,0.55); font-weight: 500; margin-bottom: 10px; }
  .demo-title { font-family: "Bricolage Grotesque", sans-serif; font-size: 32px; font-weight: 700; color: #fff; letter-spacing: -0.8px; line-height: 1.1; margin: 0 0 10px; }
  .demo-sub { font-family: "DM Sans", sans-serif; font-size: 15px; color: rgba(255,255,255,0.6); letter-spacing: -0.1px; line-height: 1.5; margin: 0; }

  /* Animation keyframes */
  @keyframes tapRipple {
    0% { transform: scale(0.6); opacity: 1; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  @keyframes pulseRing {
    0% { transform: scale(0.95); opacity: 0.55; }
    70% { transform: scale(1.1); opacity: 0; }
    100% { transform: scale(1.1); opacity: 0; }
  }
  @keyframes confettiFall {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--drift, 0), 900px) rotate(720deg); opacity: 0; }
  }
  @keyframes highlightFlash {
    0% { background-color: rgba(232,131,90,0); }
    20% { background-color: rgba(232,131,90,0.25); }
    100% { background-color: rgba(232,131,90,0); }
  }
  @keyframes rowGrowIn {
    0% { transform: translateY(-8px) scale(0.96); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes celebrateIn {
    0% { transform: translateY(8px) scale(0.96); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes celebrateIcon {
    0%, 100% { transform: rotate(-8deg) scale(1); }
    50% { transform: rotate(8deg) scale(1.08); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes bDot {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<div class="demo-header">
  <div class="demo-eyebrow">NeuLedger · First-Run Flow</div>
  <h1 class="demo-title">From welcome to first transaction.</h1>
  <p class="demo-sub">An auto-playing 22-second demo of how a new user lands, opens the app, records their salary using natural language, and sees the dashboard come to life.</p>
</div>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="onboarding-variations.jsx"></script>
<script type="text/babel" src="flow-screens.jsx"></script>
<script type="text/babel" src="flow-controller.jsx"></script>

<script type="text/babel">
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FlowDemo dark={true}/>);
</script>

</body>
</html>
